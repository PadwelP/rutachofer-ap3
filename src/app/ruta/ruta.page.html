<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>En ruta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- COMPONENTE: ion-card con el mapa + GESTO 3: Pinch / Zoom sobre la imagen -->
  <ion-card>
    <ion-card-header>
      <ion-card-subtitle>Santiago → Puerto Plata · En camino</ion-card-subtitle>
      <ion-card-title>Mapa en vivo</ion-card-title>
    </ion-card-header>
    <div class="mapa-wrap">
      <img #mapa src="assets/mapa.svg" class="mapa" alt="Mapa de la ruta" />
      <div class="mapa-hint">Pellizca con dos dedos para acercar · doble toque para restablecer</div>
    </div>
  </ion-card>

  <!-- COMPONENTE: ion-card con acciones -->
  <ion-card>
    <ion-card-content class="acciones">
      <ion-button expand="block" color="success"><ion-icon slot="start" name="location"></ion-icon>Llegué</ion-button>
      <ion-button expand="block" color="warning"><ion-icon slot="start" name="cube"></ion-icon>Recogí</ion-button>
      <ion-button expand="block" color="success"><ion-icon slot="start" name="checkmark-done"></ion-icon>Entregué</ion-button>
    </ion-card-content>
  </ion-card>

  <!-- COMPONENTE: ion-fab (botón flotante para llamar al cliente) -->
  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button color="primary"><ion-icon name="call"></ion-icon></ion-fab-button>
  </ion-fab>
</ion-content>
