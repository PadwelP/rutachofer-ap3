<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#e8eef3"/>
  <!-- bloques de ciudad -->
  <g fill="#d7e0e8">
    <rect x="20" y="20" width="120" height="90" rx="6"/>
    <rect x="170" y="20" width="150" height="60" rx="6"/>
    <rect x="350" y="20" width="110" height="90" rx="6"/>
    <rect x="490" y="20" width="90" height="120" rx="6"/>
    <rect x="20" y="140" width="90" height="110" rx="6"/>
    <rect x="140" y="110" width="180" height="80" rx="6"/>
    <rect x="350" y="140" width="120" height="100" rx="6"/>
    <rect x="20" y="280" width="140" height="100" rx="6"/>
    <rect x="200" y="220" width="120" height="160" rx="6"/>
    <rect x="360" y="280" width="100" height="100" rx="6"/>
    <rect x="490" y="170" width="90" height="100" rx="6"/>
    <rect x="490" y="290" width="90" height="90" rx="6"/>
  </g>
  <!-- calles -->
  <g stroke="#ffffff" stroke-width="10" fill="none">
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="260" x2="600" y2="260"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="340" y1="0" x2="340" y2="400"/>
    <line x1="475" y1="0" x2="475" y2="400"/>
  </g>
  <!-- ruta -->
  <polyline points="80,330 150,260 150,120 340,120 340,260 475,260 520,210"
            fill="none" stroke="#e67a12" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 14"/>
  <!-- origen -->
  <circle cx="80" cy="330" r="12" fill="#1f7a3d" stroke="#fff" stroke-width="3"/>
  <!-- destino (pin) -->
  <g transform="translate(520,210)">
    <path d="M0,-26 C14,-26 20,-14 20,-6 C20,8 0,24 0,24 C0,24 -20,8 -20,-6 C-20,-14 -14,-26 0,-26 Z" fill="#d6336c" stroke="#fff" stroke-width="2.5"/>
    <circle cx="0" cy="-6" r="6" fill="#fff"/>
  </g>
</svg>
